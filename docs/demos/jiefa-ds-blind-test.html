ancolle)"]},{"id":"R238","query":"浓雾中，一只乌鸦停在生锈的标牌上","jiefa":["nameplate","crow","plaque","markings","griffin","heron","pigeon","haze","banner","peacock","sparrow","sign","business_card","fog","bird","signpost","logo","flyer","hawk","eurasian_tree_sparrow"],"ds":["crow","sign","placard","fog","honchkrow","holding_animal","rust","animal_on_hand","cramorant","tag","looking_at_animal","stop_sign","dog","pet","smog","cloudy_sky","rusty_trombone","billboard","upper_body","karasu_tabito"]},{"id":"R239","query":"一个赤脚的人单手提鞋背对镜头走远","jiefa":["barefoot","camera","red_feet","webcam","back-to-back","lens_eye","back","racerback","video_camera","photo_shoot","piggyback","taking_picture","single_mechanical_hand","solo","t-back","movie_camera","feet","front-to-back","backstage","photographer"],"ds":["facing_back","barefoot","naked_shoes","single_bare_foot","no_shirt","no_socks","disembodied_hand","facing_away","people","bare_legs","single_wrist_cuff","holding_unworn_shoes","single_handcuff","sock_pull","holding_camera","back","back-to-back","single_bare_arm","hand_up","putting_on_footwear"]},{"id":"R240","query":"一个小型机器人用螺丝刀修理坏掉的时钟","jiefa":["repairing","robot","clock","screwdriver","robotech","humanoid_robot","toy_robot","alarm_clock","pendulum_clock","clock_hands","giant_robo","astromech_droid","bolt_(hardware)","countdown_timer","clockwork","clockshow","wall_clock","robot_dragon","cyberbots","clock_tower"],"ds":["robot","clock","screwdriver","repairing","droid","holding_screwdriver","robot_animal","clock_hands","analog_clock","damaged","screw","holding_clock","maintenance","crack","toy_robot","alarm_clock","miniature","broken_door","broken","mini_person"]}];

    const state = { cases: [], index: 0, answers: [], sides: [], answerLocked: false };
    const $ = id => document.getElementById(id);
    const shuffle = input => {
      const array = input.slice();
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    };
    const numberFormat = new Intl.NumberFormat('zh-CN');
    const tag = value => {
      const meta = META[value] || { zh: value.replaceAll('_', ' '), count: 0, wiki: '暂无 Wiki 视觉释义。' };
      const el = document.createElement('div');
      el.className = 'tag';
      el.tabIndex = 0;
      el.title = meta.wiki;
      el.setAttribute('aria-label', `${meta.zh}，${value}，引用量 ${numberFormat.format(meta.count)}。Wiki：${meta.wiki}`);
      const zh = document.createElement('span'); zh.className = 'tag-zh'; zh.textContent = meta.zh;
      const en = document.createElement('span'); en.className = 'tag-en'; en.textContent = value;
      const count = document.createElement('span'); count.className = 'tag-count'; count.textContent = `引用 ${numberFormat.format(meta.count)}`;
      el.append(zh, en, count);
      return el;
    };
    function startTest() {
      state.cases = shuffle(DATA).slice(0, 10);
      state.index = 0;
      state.answers = [];
      state.sides = state.cases.map(() => Math.random() < .5 ? 'jiefa-left' : 'ds-left');
      state.answerLocked = false;
      $('start').hidden = true;
      $('result').style.display = 'none';
      $('reveal').hidden = true;
      $('revealCases').replaceChildren();
      $('test').hidden = false;
      renderQuestion();
    }
    function renderQuestion() {
      const item = state.cases[state.index];
      const jiefaLeft = state.sides[state.index] === 'jiefa-left';
      $('query').textContent = item.query;
      $('leftTags').replaceChildren(...(jiefaLeft ? item.jiefa : item.ds).map(tag));
      $('rightTags').replaceChildren(...(jiefaLeft ? item.ds : item.jiefa).map(tag));
      $('progressText').textContent = '第 ' + (state.index + 1) + ' / 10 句';
      $('progressCount').textContent = String(state.index);
      $('progressFill').style.width = (state.index / 10 * 100) + '%';
    }
    function answer(vote) {
      if (state.answerLocked) return;
      state.answerLocked = true;
      const jiefaLeft = state.sides[state.index] === 'jiefa-left';
      state.answers.push(vote === 'tie' ? 'tie' : ((vote === 'left') === jiefaLeft ? 'jiefa' : 'ds'));
      state.index++;
      if (state.index >= state.cases.length) finishTest();
      else {
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'auto' });
      }
      state.answerLocked = false;
    }
    function finishTest() {
      $('test').hidden = true;
      $('result').style.display = 'block';
      const jiefaWins = state.answers.filter(v => v === 'jiefa').length;
      const dsWins = state.answers.filter(v => v === 'ds').length;
      const ties = state.answers.filter(v => v === 'tie').length;
      $('jiefaWins').textContent = String(jiefaWins);
      $('dsWins').textContent = String(dsWins);
      $('ties').textContent = String(ties);
      $('resultSummary').textContent = jiefaWins === dsWins ? '本次盲测两套结果获得的偏好票数相同。' : (jiefaWins > dsWins ? '本次盲测中，洁珐获得更多用户偏好。' : '本次盲测中，DS 获得更多用户偏好。');
      drawResult(jiefaWins, dsWins, ties);
      renderReveal();
    }
    function renderReveal() {
      const container = $('revealCases');
      container.replaceChildren();
      state.cases.forEach((item, index) => {
        const jiefaLeft = state.sides[index] === 'jiefa-left';
        const vote = state.answers[index];
        const voteLabel = vote === 'tie' ? '你的选择：无法判断' : `你的选择：${vote === 'jiefa' ? '洁珐' : 'DS'} 更好`;
        const card = document.createElement('article');
        card.className = 'reveal-case';
        const query = document.createElement('h4');
        query.className = 'reveal-query';
        query.textContent = `第 ${index + 1} 句：${item.query}`;
        const sides = document.createElement('div');
        sides.className = 'reveal-sides';
        const makeSide = (sideName, tags, source) => {
          const panel = document.createElement('div');
          panel.className = 'reveal-side';
          const head = document.createElement('div');
          head.className = 'reveal-side-head';
          const label = document.createElement('span');
          label.innerHTML = `${sideName}：<span class="reveal-source"></span>`;
          label.querySelector('.reveal-source').textContent = source;
          const voteEl = document.createElement('span');
          voteEl.className = 'reveal-vote';
          voteEl.textContent = sideName === (vote === 'jiefa' ? (jiefaLeft ? '左侧' : '右侧') : vote === 'ds' ? (jiefaLeft ? '右侧' : '左侧') : '') ? voteLabel : '';
          head.append(label, voteEl);
          const list = document.createElement('div');
          list.className = 'reveal-tags';
          tags.forEach(value => {
            const meta = META[value] || { zh: value.replaceAll('_', ' ') };
            const tagEl = document.createElement('span');
            tagEl.className = 'reveal-tag';
            tagEl.title = meta.wiki || '暂无 Wiki 视觉释义。';
            tagEl.textContent = meta.zh || value;
            const en = document.createElement('small');
            en.textContent = ` (${value})`;
            tagEl.append(en);
            list.append(tagEl);
          });
          panel.append(head, list);
          return panel;
        };
        sides.append(makeSide('左侧', jiefaLeft ? item.jiefa : item.ds, jiefaLeft ? '洁珐' : 'DS'));
        sides.append(makeSide('右侧', jiefaLeft ? item.ds : item.jiefa, jiefaLeft ? 'DS' : '洁珐'));
        card.append(query, sides);
        container.append(card);
      });
      $('reveal').hidden = false;
    }
    function drawResult(jiefaWins, dsWins, ties) {
      const canvas = $('resultCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = '#f5f7fa'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#17202a'; ctx.font = '700 48px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif'; ctx.fillText('洁珐 vs DS · 语义检索盲测结果', 82, 105);
      ctx.fillStyle = '#6b7580'; ctx.font = '24px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif'; ctx.fillText('随机抽取 10 句 · DS = 某tag 搜索工具 · 盲测完成后揭晓身份', 84, 150);
      const cards = [
        { label: '洁珐', value: jiefaWins, color: '#2563eb' },
        { label: 'DS', value: dsWins, color: '#16805c' },
        { label: '无法判断', value: ties, color: '#8a94a1' },
      ];
      cards.forEach((card, index) => {
        const x = 82 + index * 412;
        ctx.fillStyle = '#ffffff'; ctx.fillRect(x, 220, 350, 250);
        ctx.strokeStyle = '#d9dee5'; ctx.strokeRect(x, 220, 350, 250);
        ctx.fillStyle = card.color; ctx.fillRect(x, 220, 350, 12);
        ctx.fillStyle = '#6b7580'; ctx.font = '24px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif'; ctx.fillText(card.label, x + 30, 282);
        ctx.fillStyle = '#17202a'; ctx.font = '700 82px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif'; ctx.fillText(String(card.value), x + 30, 388);
        ctx.fillStyle = '#6b7580'; ctx.font = '22px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif'; ctx.fillText('票', x + 35, 430);
      });
      const winner = jiefaWins === dsWins ? '本次结果：平票' : '本次结果：' + (jiefaWins > dsWins ? '洁珐更受偏好' : 'DS 更受偏好');
      ctx.fillStyle = '#17202a'; ctx.font = '700 32px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif'; ctx.fillText(winner, 82, 590);
      ctx.fillStyle = '#6b7580'; ctx.font = '20px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif'; ctx.fillText('结果仅代表本次随机抽样的用户偏好，不等同于总体准确率。', 84, 638);
      ctx.fillText(new Date().toLocaleString('zh-CN'), 84, 690);
    }
    function saveResult() {
      const link = document.createElement('a');
      link.download = 'jiefa-ds-blind-test-result.png';
      link.href = $('resultCanvas').toDataURL('image/png');
      link.click();
    }
    document.querySelectorAll('[data-vote]').forEach(button => button.addEventListener('click', () => answer(button.dataset.vote)));
    $('startBtn').addEventListener('click', startTest);
    $('saveBtn').addEventListener('click', saveResult);
    $('restartBtn').addEventListener('click', startTest);
  </script>
</body>
